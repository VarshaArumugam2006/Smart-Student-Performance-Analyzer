 let s=`<svg viewBox="0 0 ${W} ${H}">`;[10,30,50,70,90].forEach(v=>s+=`<line x1="${L}" x2="${W-8}" y1="${py(v)}" y2="${py(v)}" stroke="var(--line)"/><text x="4" y="${py(v)+3}">${v}</text>`);
 [30,50,60,75,100].forEach(v=>s+=`<text x="${px(v)-8}" y="${H-8}">${v}</text>`);
 s+=`<line x1="${px(60)}" x2="${px(60)}" y1="8" y2="${H-B}" stroke="#94A3B8" stroke-dasharray="2 3"/><line x1="${px(75)}" x2="${px(75)}" y1="8" y2="${H-B}" stroke="#64748B" stroke-dasharray="5 3"/>`;
 x.forEach(v=>s+=`<circle cx="${px(v.t)}" cy="${py(v.a)}" r="3.2" fill="${RC[v.k]}" opacity=".75"><title>${v.n}: ${f1(v.t)}% att, ${f1(v.a)} avg</title></circle>`);
 return s+`<text x="${L}" y="${H-0}">Attendance % (x) vs average marks (y); dashed lines at 60% and 75%</text></svg>`}
function draw(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const x=S.filter(s=>(F.d=='All'||s.d==F.d)&&(F.g=='All'||s.g==F.g)&&(F.k=='All'||s.k==F.k)&&(F.gr=='All'||s.gr==F.gr));
 document.getElementById('sub').textContent=`${x.length} of ${S.length} students in view`;
 const M=document.getElementById('m');
 if(!x.length){M.innerHTML='<div class="c" style="margin-top:12px">No students match these filters.</div>';return}
 const n=x.length,hi=x.filter(s=>s.k=='High').length,pass=x.filter(s=>s.pass).length,lo75=x.filter(s=>s.t<75).length,top=[...x].sort((a,b)=>b.a-a.a||a.id.localeCompare(b.id));
 const kp=[['Total Students',n,'#2F6FED'],['Average Marks',f1(avg(x,s=>s.a)),'#14B8A6'],['Avg Attendance',f1(avg(x,s=>s.t))+'%','#F2A93B'],['Pass %',f1(pass/n*100)+'%','#2E9E6B'],['Highest Score',f1(top[0].a),'#8B5CF6'],['At-Risk (High)',hi,'#D64545']];
 let h=`<div class="kpis">${kp.map(k=>`<div class="k" style="--c:${k[2]}"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><div class="g">`;
 const deps=U(x.map(s=>s.d)).map(d=>{const y=x.filter(s=>s.d==d);return{l:d,v:avg(y,s=>s.a),p:y.filter(s=>s.pass).length/y.length*100,t:avg(y,s=>s.t),n:y.length}}).sort((a,b)=>b.v-a.v);
 const subs=[['Maths','m'],['Science','s'],['English','e'],['Computer','c']].map(([l,k])=>({l,v:avg(x,s=>s[k]),p:x.filter(s=>s[k]>=50).length/n*100}));
 if(tab=='Overview'){
  const gd=['A+','A','B','C','D','F'].map(g=>({l:g,v:x.filter(s=>s.gr==g).length,c:GC[g]}));
  const bands=[['<50',0,50],['50-59',50,60],['60-69',60,70],['70-74',70,75],['75-79',75,80],['80-89',80,90],['90+',90,101]].map(([l,a,b])=>({l,v:x.filter(s=>s.t>=a&&s.t<b).length,c:a<60?'#D64545':a<75?'#F2A93B':'#2E9E6B'}));
  const bs=[...subs].sort((a,b)=>b.v-a.v),wd=deps[deps.length-1],bd=deps[0],r=pearson(x);
  h+=`<div class="c"><h3>Department-wise average marks</h3>${hb(deps,100)}</div><div class="c"><h3>Subject-wise average marks</h3>${hb(subs.map((s,i)=>({...s,c:['#14B8A6','#2F6FED','#F2A93B','#8B5CF6'][i]})),100)}</div>
  <div class="c"><h3>Grade distribution</h3>${cols(gd)}</div><div class="c"><h3>Attendance distribution</h3>${cols(bands)}</div>
  <div class="c wide"><h3>Top 10 students</h3>${tbl(['#','Student','Department','Avg','Grade'],top.slice(0,10).map((s,i)=>[i+1,s.n,s.d,f1(s.a),s.gr]))}</div>
  <div class="c wide ins"><h3>Automatic insights</h3><p><b>Departments:</b> best is ${bd.l} (${f1(bd.v)}); lowest is ${wd.l} (${f1(wd.v)}).</p><p><b>Subjects:</b> best is ${bs[0].l} (${f1(bs[0].v)}); weakest is ${bs[3].l} (${f1(bs[3].v)}).</p><p><b>Risk:</b> ${f1(hi/n*100)}% of students (${hi}) are High risk; ${x.filter(s=>s.k=='Medium').length} more are on watch.</p><p><b>Attendance:</b> ${f1(lo75/n*100)}% (${lo75}) are below 75%.</p></div>`}
 if(tab=='Attendance'){
  const r=pearson(x),a=x.filter(s=>s.t<75),b=x.filter(s=>s.t>=75),st=Math.abs(r)>=.7?'strong':Math.abs(r)>=.4?'moderate':Math.abs(r)>=.2?'weak':'no meaningful';
  h+=`<div class="c wide"><h3>Attendance vs average marks (r = ${r.toFixed(2)})</h3>${scatter(x)}<div class="nt">Red = High risk, amber = Medium, green = Low.</div></div>
  <div class="c"><h3>Marks by attendance group</h3>${hb([{l:'Below 75%',v:avg(a,s=>s.a),c:'#D64545'},{l:'75% and above',v:avg(b,s=>s.a),c:'#2E9E6B'}],100)}<div class="nt">${a.length} students below 75%, ${b.length} at or above.</div></div>
  <div class="c ins"><h3>Insight</h3><p>Attendance has a ${st} ${r>=0?'positive':'negative'} relationship with performance (r = ${r.toFixed(2)}).</p><p><b>Recommendation:</b> ${lo75} students below 75% need monitoring: mentor check-ins, parent communication and attendance alerts.</p></div>
  <div class="c wide"><h3>Department attendance</h3>${hb(deps.map(d=>({l:d.l,v:d.t})),100,v=>f1(v)+'%')}</div>`}
 if(tab=='At-Risk Students'){
  const rs=['High','Medium','Low'].map(k=>({l:k,v:x.filter(s=>s.k==k).length,c:RC[k]})),qq=q.toLowerCase();
  const l=x.filter(s=>s.k!='Low'&&(!qq||(s.n+s.id).toLowerCase().includes(qq))).sort((a,b)=>(a.k=='High'?0:1)-(b.k=='High'?0:1)||a.a-b.a);
  h+=`<div class="c"><h3>Risk level distribution</h3>${cols(rs)}<div class="nt">High: attendance &lt; 60 or average &lt; 50. Low: attendance ≥ 75 and average ≥ 60.</div></div>
  <div class="c ins"><h3>Recommendations</h3><p>${x.filter(s=>s.a<50).length} students with average below 50 need remedial classes and peer tutoring.</p><p>${lo75} students below 75% attendance need monitoring.</p><p>Weakest subject: <b>${[...subs].sort((a,b)=>a.v-b.v)[0].l}</b> (${f1([...subs].sort((a,b)=>a.v-b.v)[0].v)}).</p></div>
  <div class="c wide"><h3>Students needing attention (${l.length}) <input id="q" placeholder="Search name or ID" value="${q}" style="float:right;padding:4px 8px"></h3>${tbl(['Student','Department','Attendance','Avg','Risk','Reason'],l.slice(0,60).map(s=>[s.n+' <small style="color:var(--mut)">'+s.id+'</small>',s.d,f1(s.t)+'%',f1(s.a),pill(s.k),s.why]))}${l.length>60?`<div class="nt">Showing first 60 of ${l.length}; use search to narrow.</div>`:''}</div>`}
 if(tab=='Rankings'){
  h+=`<div class="c wide"><h3>Department league table</h3>${tbl(['Rank','Department','Students','Avg marks','Pass %','Avg attendance'],deps.map((d,i)=>[i+1,d.l,d.n,f1(d.v),f1(d.p)+'%',f1(d.t)+'%']))}</div>
  <div class="c wide"><h3>Student ranking (top 25 in current view)</h3>${tbl(['Rank','Student','Department','Avg','Grade','Risk'],top.slice(0,25).map((s,i,arr)=>[top.findIndex(t=>t.a===s.a)+1,s.n,s.d,f1(s.a),s.gr,pill(s.k)]))}</div>`}
 M.innerHTML=h+'</div>';
 const qe=document.getElementById('q');if(qe){qe.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;draw();const z=document.getElementById('q');z.focus();z.setSelectionRange(p,p)}}
}
setup();draw();
</script></body></html>
